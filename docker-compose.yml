# Relay seul, sans le Hub : docker compose up -d --build
# Poser RELAY_IP (adresse de la machine) et RELAY_HUB_TOKEN (ou laisser vide
# sans Hub) dans .env. Le jeton d'installation du premier compte s'affiche
# dans « docker compose logs relay ».
name: relay

services:
  caddy:
    build: { context: ., target: caddy }
    image: ghcr.io/codexx64/relay-caddy:2.1.1
    container_name: relay-caddy
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "80"
    volumes: [caddy-data:/data, caddy-config:/config, caddy-admin:/run/caddy]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [relay]

  dns:
    build: { context: ., target: dns }
    image: ghcr.io/codexx64/relay-dns:2.1.1
    container_name: relay-dns
    restart: unless-stopped
    command: ["--address=/${RELAY_ZONE:-home.arpa}/${RELAY_IP:?RELAY_IP est requis}"]
    volumes: ["relay-dns:/etc/relay-hosts:ro"]
    ports: ["${RELAY_IP:?RELAY_IP est requis}:53:53/udp", "${RELAY_IP:?RELAY_IP est requis}:53:53/tcp"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "53"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [relay]

  relay:
    build: { context: ., target: relay }
    image: ghcr.io/codexx64/relay:2.1.1
    container_name: relay
    restart: unless-stopped
    depends_on: [caddy]
    ports: ["127.0.0.1:8095:8095"]
    volumes: [relay-data:/data, caddy-admin:/run/caddy, relay-dns:/run/dns]
    env_file: [.env]
    environment:
      RELAY_DNS_DIR: /run/dns
      RELAY_CADDY_SOCKET: /run/caddy/admin.sock
      RELAY_CADDY_SERVICE: http://relay-caddy:80
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [relay]

volumes:
  caddy-data:
  caddy-config:
  caddy-admin:
  relay-data:
  relay-dns:

networks:
  relay:
