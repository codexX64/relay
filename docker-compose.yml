# Relay seul, sans le Hub : docker compose up -d --build
# Poser RELAY_IP (adresse de la machine) et RELAY_HUB_TOKEN (ou laisser vide
# sans Hub) dans .env, et la clé maîtresse dans secrets/ (README, « Relay
# seul »). Le jeton d'installation du premier compte s'affiche dans
# « docker compose logs relay ».
name: relay

services:
  caddy:
    build: { context: ., target: caddy }
    image: ghcr.io/codexx64/relay-caddy:2.3.1
    container_name: relay-caddy
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "80"
    volumes: [caddy-data:/data, caddy-config:/config, caddy-admin:/run/caddy]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks: [relay]

  dns:
    build: { context: ., target: dns }
    image: ghcr.io/codexx64/relay-dns:2.3.1
    container_name: relay-dns
    restart: unless-stopped
    command: ["--address=/${RELAY_ZONE:-home.arpa}/${RELAY_IP:?RELAY_IP est requis}"]
    volumes: ["relay-dns:/etc/relay-hosts:ro"]
    ports: ["${RELAY_IP:?RELAY_IP est requis}:53:53/udp", "${RELAY_IP:?RELAY_IP est requis}:53:53/tcp"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "53"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
    networks: [relay]

  relay:
    build: { context: ., target: relay }
    image: ghcr.io/codexx64/relay:2.3.1
    container_name: relay
    restart: unless-stopped
    depends_on: [caddy]
    ports: ["127.0.0.1:8095:8095"]
    volumes: [relay-data:/data, caddy-admin:/run/caddy, relay-dns:/run/dns]
    env_file: [.env]
    environment:
      RELAY_DNS_DIR: /run/dns
      RELAY_CADDY_SOCKET: /run/caddy/admin.sock
      RELAY_CADDY_SERVICE: http://relay-caddy:80
      # La clé maîtresse vient d'un fichier hors du volume de données : une copie
      # du volume ne suffit pas à ouvrir ce qu'elle scelle (README, « Relay seul »).
      SOCLE_CLE_FILE: /run/secrets/socle_cle
      SOCLE_CLE_ANCIENNE_FILE: /run/secrets/socle_cle_ancienne
    secrets: [socle_cle, socle_cle_ancienne]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    # Journaux du conteneur, où part aussi le journal de sécurité : gardés par
    # le démon Docker, hors de portée du service, cinq fichiers de 10 Mo.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks: [relay]

secrets:
  socle_cle:
    file: ./secrets/socle_cle
  # Vide, sauf pendant une rotation (README, « Tourner la clé maîtresse »).
  socle_cle_ancienne:
    file: ./secrets/socle_cle_ancienne

volumes:
  caddy-data:
  caddy-config:
  caddy-admin:
  relay-data:
  relay-dns:

networks:
  relay:
